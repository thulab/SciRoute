name: Restore verified CI dependencies
description: Restore the current run's dependency bundle and validate its contents and ABI
runs:
  using: composite
  steps:
    - name: Download this run's dependency bundle
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ci-dependencies
        path: ${{ runner.temp }}
    - name: Extract and activate dependencies
      shell: bash
      run: |
        python3 ci/activate_dependencies.py \
          --archive "$RUNNER_TEMP/ci-dependencies.tar.gz" \
          --prefix "$RUNNER_TEMP/iotdbfs-deps" \
          --github-env "$GITHUB_ENV"
