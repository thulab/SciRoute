# IoTDB-FS configuration
# Lines starting with #, ; or // are treated as comments.

# IoTDB connection
iotdb.host=127.0.0.1
iotdb.port=6667
iotdb.user=root
iotdb.pass=root
iotdb.db=dfs
iotdb.use_prepared=0

# Connection pool size hint (optional)
iotdb.pool_size=16

# Logging output directory
log.dir=logs
log.level=INFO

# Mount point
mount.point=/mnt/dfs

# Web file explorer
web.host=127.0.0.1
web.port=8080

# Cache tuning
cache.decoded.max_bytes=512MB
cache.read.chunk_size=1MB
cache.read.full_prefetch_max_bytes=32MB
cache.raw_file.max_bytes=256MB

# Shared typed-query fragments (separate from the ordinary file-read caches).
# Positive integer counts/bytes; keep the entry safety cap as well as the byte cap.
query.cache.memory_budget_bytes=1073741824
query.cache.max_entries=16384
query.cache.max_inflight=256
query.cache.worker_threads=4
# Training-only concurrent read lanes (1..4). Requires at least 64 inflight
# fragments and one cache worker per lane, plus enough IoTDB pool sessions.
query.training.read_parallelism=1
# Indexed HDF5 chunk batch read lanes (1, 2, or 4), physical and GPS routes.
# Uses the same persistent query runtime and IoTDB session pool.
query.hdf5.read_parallelism=1
# Both HDF5 modes use the publication-sealed cross-file catalog. Values are
# either located by native libhdf5 over a bound immutable filesystem file, or by
# IoTDB-FS layout/chunk indexes. This is an execution choice, not a SQL audit
# setting. Ingestion and the persisted layout are unchanged in both modes.
# Values: native-hdf5 | iotdb-indexed (default).
query.hdf5.mode=iotdb-indexed
# native-hdf5 requires owner mode and a private mode-0700 ordinary-FS root.
# Existing versions require an explicit native-file-bind preparation step.
# storage.native_file_root=/absolute/private/native-files
# GRIB parsed metadata indexes, separate from decoded values and shared fragments.
# Positive integer limits. The high version cap leaves the 64 MiB byte budget
# as the main retention bound; a small cap causes multi-file scan cache thrashing.
query.grib.index_cache.max_versions=65536
query.grib.index_cache.memory_budget_bytes=67108864

# Writer tuning
writer.db_request_max_bytes=20MB
# Generic ingestion payload bytes per OBJECT transfer (positive integer, <=8 MiB).
# Must fit writer.db_request_max_bytes and the manifest checkpoint budget below;
# it is not silently clamped. SDK/OBJECT framing adds bytes beyond this payload.
# This does not change legacy GRIB streaming or ordinary file-read chunks.
writer.transfer_chunk_bytes=1048576
# Durable payload frontier checkpoint budget (bytes, integer, at most 8 MiB).
# One manifest read/update per checkpoint batch, containing one or more transfers.
writer.manifest_batch_max_bytes=8388608

# Inode cache
inode.cache.capacity=16384
inode.cache.flush_interval_ms=5000

# GRIB message cache
grib.extension.enabled=true
grib.message_cache.max_entries=256

# Metadata field definitions, relative to this configuration file.
# IOTDB_METADATA_CONFIG_FILE overrides this path.
metadata.config=metadata.properties

# Prepared modules own immutable declarations; retain false for controlled ablation.
query.training.reuse_prepared_validation=true
# Compile ordered normalization statistics once per prepared view.
query.training.compiled_transform=true
